  <!-- Mark V-Nest -->
  <g id="vouchNestMark">
    <!-- Left Arm: Solid Slanted Bar with Horizontal Flat Top -->
    <path
      d="M 22 34 H 44 L 70 78 H 48 Z"
      fill="#FFFFFF"
    />

    <!-- Right Arm: Back Ticket (Secondary Layer peeking behind on top right) -->
    <g transform="translate(75, 10) rotate(32)">
      <path
        d="M 10 0 H 23 C 25.5 0, 28 2.5, 28 5 V 42"
        stroke="#FFFFFF"
        stroke-width="4.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </g>

    <!-- Right Arm: Front Ticket Body (Tilted rounded voucher) -->
    <g transform="translate(68, 14) rotate(32)">
      <rect
        x="0"
        y="0"
        width="28"
        height="58"
        rx="5"
        stroke="#FFFFFF"
        stroke-width="4.2"
        fill="#000000"
      />
      <!-- Stub tear-off line across upper ticket -->
      <line
        x1="0"
        y1="15"
        x2="28"
        y2="15"
        stroke="#FFFFFF"
        stroke-width="3.8"
        stroke-linecap="round"
      />
    </g>

    <!-- Interwoven Nest Cradle Twigs -->
    <path
      d="M 16 56 C 12 90, 68 104, 126 54"
      stroke="#FFFFFF"
      stroke-width="4.5"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 22 66 C 26 94, 98 98, 122 66"
      stroke="#FFFFFF"
      stroke-width="3.8"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 28 76 C 40 98, 96 100, 114 78"
      stroke="#FFFFFF"
      stroke-width="3.2"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 36 86 C 54 102, 90 103, 106 88"
      stroke="#FFFFFF"
      stroke-width="2.8"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Crossing twig accents for authentic woven texture -->
    <path d="M 30 78 L 70 98" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 40 88 L 82 100" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 64 98 L 108 80" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 76 99 L 118 74" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 50 102 L 98 102" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
  </g>

